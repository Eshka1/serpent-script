<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>serpent-script</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="stage"></canvas>
    <div id="scroll-space"></div>

    <button id="edit-toggle" type="button">✎ Use your own text</button>

    <form id="editor" hidden>
        <h2>Your own text</h2>
        <label>
            Title
            <input id="title-input" type="text" maxlength="12" placeholder="SERPENT">
        </label>
        <label>
            Text
            <textarea id="text-input" rows="10" maxlength="4000"
                placeholder="Paste or type anything. Leave an empty line between paragraphs."></textarea>
        </label>
        <div class="editor-footer">
            <span id="char-count">0 / 4000</span>
            <button type="button" id="reset-button">Reset</button>
            <button type="submit">Apply</button>
        </div>
    </form>
    <script type="module" src="main.js"></script>
</body>

</html>
